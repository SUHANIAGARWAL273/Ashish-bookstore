
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install

  build:
    commands:
      - npm run build
      - cp -r public .next/standalone/ 2>/dev/null || true
      - cp -r .next/static .next/standalone/.next/

artifacts:
  base-directory: .next/standalone
  files:
    - '**/*'
  exclude-paths:
    - .env*
    - cloudfront-private-key-new.pem
    - cloudfront-public-key-new.pem
